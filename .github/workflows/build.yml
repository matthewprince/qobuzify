name: Build desktop apps

# Builds the Qobuzify desktop wrapper for Linux, macOS, and Windows.
# - workflow_dispatch: validation build, uploads artifacts only (no release).
# - push tag v*:       full build, publishes a GitHub Release with all installers.
#
# All three runners are free with no minute cap because this repo is public. If a
# faster macOS build is ever wanted, swap the macos-14 runner below for a WarpBuild
# label (e.g. warp-macos-latest-arm64); nothing else changes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Pinned mpv-AppImage release baked into the Linux build. This binary gets exclusive DAC access, so it
# is pinned by tag AND checksum-verified before extraction (never /latest). To bump: pick the new tag,
# download its anylinux-x86_64 asset, sha256sum it, update all three values together.
env:
  MPV_APPIMAGE_TAG: "v0.41.0@2026-07-01_1782914175"
  MPV_APPIMAGE_ASSET: "mpv-v0.41.0-anylinux-x86_64.AppImage"
  MPV_APPIMAGE_SHA256: "9ba489eb78c39fa4d5ef9cfaf9e80b92dcb9f69a05dd365d30255e6dca3c8fbd"

jobs:
  check-version:
    name: Tag matches wrapper version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that drifts from wrapper/package.json ships wrongly-named assets and a permanent
      # update nag (the in-app checker compares package.json's version against the release tag).
      - name: Assert tag == wrapper/package.json version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Not a tag build; skipping the version check."
            exit 0
          fi
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(node -p "require('./wrapper/package.json').version")
          echo "tag=v${TAG_VER} package.json=${PKG_VER}"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag v${TAG_VER} does not match wrapper/package.json version ${PKG_VER}. Bump the version or retag."
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: "--linux"
          - os: windows-latest
            args: "--win"
          - os: macos-14
            args: "--mac --universal"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrapper dependencies
        working-directory: wrapper
        run: npm ci

      # Bundle a portable mpv into the Linux build so the AppImage is self-contained (deb keeps pactl as a
      # dep; mpv is bundled for both). The wrapper spawns mpv as a subprocess for bit-perfect output, so a
      # process-boundary bundle is mere aggregation - unmodified upstream mpv, GPL honored, no libmpv link.
      # anylinux == portable across distros. Extracted tree lands at wrapper/resources/mpv (extraResources).
      # Runs BEFORE the payload bake: prebuild.js hard-fails a Linux build with no resources/mpv.
      # Pinned tag + sha256 (env at top of file), verified before extraction.
      # Its get-yt-dlp and self-updater hooks are dropped at package time (extraResources filter in
      # wrapper/package.json): mpv inherits $APPIMAGE from our runtime, so they popped dialogs about OUR AppImage.
      # Re-check bin/*.hook for anything that calls `notify` whenever MPV_APPIMAGE_TAG is bumped.
      - name: Bundle mpv (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: wrapper
        run: |
          set -euo pipefail
          URL="https://github.com/pkgforge-dev/mpv-AppImage/releases/download/${MPV_APPIMAGE_TAG//@/%40}/${MPV_APPIMAGE_ASSET}"
          echo "mpv AppImage: $URL"
          curl -fsSL -o mpv.AppImage "$URL"
          echo "${MPV_APPIMAGE_SHA256}  mpv.AppImage" | sha256sum -c -
          chmod +x mpv.AppImage
          ./mpv.AppImage --appimage-extract >/dev/null
          rm -rf resources/mpv && mkdir -p resources
          # extract yields squashfs-root (a real dir or a symlink to AppDir); -L follows either.
          cp -aL squashfs-root resources/mpv
          chmod +x resources/mpv/AppRun || true
          [ -x resources/mpv/bin/mpv ] || chmod +x resources/mpv/bin/mpv || true
          test -x resources/mpv/AppRun
          resources/mpv/AppRun --version | head -1
          rm -rf mpv.AppImage squashfs-root

      - name: Bake Qobuzify payload
        working-directory: wrapper
        run: npm run prebuild

      - name: Build installers
        if: matrix.os != 'macos-14'
        working-directory: wrapper
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --no-install electron-builder ${{ matrix.args }} -p never

      # macOS: sign the merged universal app with Qobuzify's own self-signed identity, then build the dmg/zip from
      # that signed app. Without a stable signature macOS cannot remember a privacy decision, so users were asked
      # "Allow 'Qobuzify' to access your microphone?" over and over (the request comes from native audio code; web
      # permission requests are already denied in main.js). Not an Apple Developer ID, so Gatekeeper's warning is
      # unchanged. Signing can't be done in afterPack (it runs per-arch before the universal merge). Best-effort:
      # without the secret, or if any signing step fails, this ships the unsigned build exactly as before.
      - name: Build installers (macOS, signed)
        if: matrix.os == 'macos-14'
        working-directory: wrapper
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -uo pipefail
          plain() { npx --no-install electron-builder ${{ matrix.args }} -p never; }
          if [ -z "${MAC_CERT_P12:-}" ]; then echo "::warning::MAC_CERT_P12 not set; unsigned build"; plain; exit $?; fi
          npx --no-install electron-builder ${{ matrix.args }} --dir -p never || { echo "::warning::--dir build failed; unsigned build"; plain; exit $?; }
          APP=$(ls -d dist/mac-universal/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "::warning::no universal .app found; unsigned build"; plain; exit $?; fi
          KC="$RUNNER_TEMP/qz-sign.keychain-db"; KCP=$(openssl rand -hex 16)
          signed=0
          if security create-keychain -p "$KCP" "$KC" \
             && security set-keychain-settings -lut 3600 "$KC" \
             && security unlock-keychain -p "$KCP" "$KC" \
             && printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/qz-sign.p12" \
             && security import "$RUNNER_TEMP/qz-sign.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign \
             && security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" "$KC" >/dev/null \
             && security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"') \
             && codesign --force --deep --timestamp=none --keychain "$KC" --sign "Qobuzify" "$APP"; then
            signed=1
            codesign -dvv "$APP" 2>&1 | grep -E '^(Identifier|Authority)=' || true
            codesign --verify --deep "$APP" && echo "signature verifies" || echo "::warning::codesign --verify complained (self-signed); shipping it signed anyway"
          else
            echo "::warning::signing failed; packaging the unsigned app"
          fi
          rm -f "$RUNNER_TEMP/qz-sign.p12"
          echo "signed=$signed"
          npx --no-install electron-builder --mac --universal --prepackaged "$APP" -p never || { echo "::warning::prepackaged packaging failed; unsigned rebuild"; plain; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qobuzify-${{ matrix.os }}
          if-no-files-found: error
          path: |
            wrapper/dist/*.AppImage
            wrapper/dist/*.deb
            wrapper/dist/*.exe
            wrapper/dist/*.dmg
            wrapper/dist/*.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILES=$(find artifacts -type f | sort)
          echo "Releasing $TAG with:"; echo "$FILES"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Qobuzify $TAG" \
            --notes "Desktop builds of Qobuzify for Linux, macOS, and Windows. These are unsigned: on macOS, right-click the app and choose Open the first time; on Windows, click More info then Run anyway." \
            $FILES
